<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Tambah Transaksi - FinTrack</title>
<!-- Tailwind CSS with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-surface": "#2e3132",
                    "tertiary-fixed": "#ffdad6",
                    "tertiary-container": "#670007",
                    "outline-variant": "#c6c5d4",
                    "surface-dim": "#d9dadb",
                    "on-surface-variant": "#454652",
                    "surface-container-high": "#e7e8e9",
                    "secondary": "#1b6d24",
                    "primary": "#000666",
                    "tertiary-fixed-dim": "#ffb4ac",
                    "primary-fixed-dim": "#bdc2ff",
                    "surface": "#f8f9fa",
                    "on-background": "#191c1d",
                    "error": "#ba1a1a",
                    "tertiary": "#400003",
                    "on-tertiary-fixed": "#410003",
                    "surface-tint": "#4c56af",
                    "surface-bright": "#f8f9fa",
                    "on-error-container": "#93000a",
                    "on-primary-fixed": "#000767",
                    "primary-container": "#1a237e",
                    "error-container": "#ffdad6",
                    "outline": "#767683",
                    "secondary-fixed-dim": "#88d982",
                    "inverse-on-surface": "#f0f1f2",
                    "inverse-primary": "#bdc2ff",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#343d96",
                    "background": "#f8f9fa",
                    "on-tertiary-container": "#ff635a",
                    "primary-fixed": "#e0e0ff",
                    "secondary-container": "#a0f399",
                    "on-secondary-container": "#217128",
                    "on-secondary-fixed": "#002204",
                    "surface-container-highest": "#e1e3e4",
                    "on-secondary-fixed-variant": "#005312",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed-variant": "#93000e",
                    "on-secondary": "#ffffff",
                    "surface-container": "#edeeef",
                    "on-surface": "#191c1d",
                    "secondary-fixed": "#a3f69c",
                    "surface-variant": "#e1e3e4",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-container": "#8690ee",
                    "surface-container-low": "#f3f4f5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "1rem",
                    "stack-sm": "0.5rem",
                    "margin-mobile": "1.25rem",
                    "stack-lg": "1.5rem",
                    "gutter": "1rem"
            },
            "fontFamily": {
                    "body-md": ["Inter", "sans-serif"],
                    "headline-lg": ["Inter", "sans-serif"],
                    "body-lg": ["Inter", "sans-serif"],
                    "headline-md": ["Inter", "sans-serif"],
                    "display-currency": ["Inter", "sans-serif"],
                    "label-sm": ["Inter", "sans-serif"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-currency": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        /* Custom Utilities for Hide Scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased w-full h-screen flex flex-col relative overflow-hidden">
<!-- TASK NAV: App Bar (Task variant, avoiding BottomNav shell per rules) -->
<header class="w-full top-0 sticky border-b border-outline-variant flat transition-colors duration-200 flex justify-between items-center px-margin-mobile py-stack-sm bg-surface z-40">
<!-- Leading Action: Close/Cancel (Task Flow) -->
<button aria-label="Batal" class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
<!-- Center Title -->
<h1 class="text-headline-md font-headline-md text-primary font-bold">Tambah Transaksi</h1>
<!-- Trailing Action: Invisible spacer for centering -->
<div class="w-10"></div>
</header>
<!-- MAIN CANVAS -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-32">
<div class="w-full max-w-lg mx-auto p-margin-mobile flex flex-col gap-stack-lg mt-2">
<!-- Segmented Control -->
<div class="flex p-1 bg-surface-container-highest rounded-lg gap-1 w-full relative">
<!-- Active Indicator (Simulated with absolute positioning for future animation, here static for pure HTML/CSS) -->
<!-- We apply active class directly to first item as default state -->
<button class="flex-1 py-2 px-1 text-label-sm font-label-sm bg-surface rounded shadow-sm text-primary z-10 transition-all">Pengeluaran</button>
<button class="flex-1 py-2 px-1 text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface z-10 transition-all">Pemasukan</button>
<button class="flex-1 py-2 px-1 text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface z-10 transition-all">Transfer</button>
</div>
<!-- Main Amount Input Area -->
<div class="flex flex-col items-center justify-center py-6">
<div class="flex items-center gap-1 group relative">
<span class="text-display-currency font-display-currency text-on-surface-variant group-focus-within:text-primary transition-colors">Rp</span>
<input class="text-display-currency font-display-currency text-on-surface bg-transparent border-none p-0 w-[120px] text-center focus:ring-0 focus:outline-none focus:text-primary transition-colors placeholder:text-outline-variant" inputmode="numeric" placeholder="0" type="text"/>
<!-- Hidden auto-sizing span could go here for true fluidity, keeping fixed width for simplicity in HTML demo -->
</div>
<div class="h-[1px] w-32 bg-outline-variant mt-2"></div>
</div>
<!-- Fields Container (Bento / Card Style) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden flex flex-col">
<!-- Akun Field -->
<button class="flex items-center w-full px-4 py-4 gap-4 border-b border-outline-variant hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed shrink-0 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<span class="text-label-sm font-label-sm text-outline mb-0.5">Akun</span>
<span class="text-body-lg font-body-lg text-on-surface">BCA</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-outline transition-colors">chevron_right</span>
</button>
<!-- Kategori Field -->
<button class="flex items-center w-full px-4 py-4 gap-4 border-b border-outline-variant hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center text-on-error-container shrink-0 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<span class="text-label-sm font-label-sm text-outline mb-0.5">Kategori</span>
<span class="text-body-lg font-body-lg text-on-surface">Makan &amp; Minum</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-outline transition-colors">chevron_right</span>
</button>
<!-- Tanggal & Waktu Field -->
<button class="flex items-center w-full px-4 py-4 gap-4 border-b border-outline-variant hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant shrink-0 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<span class="text-label-sm font-label-sm text-outline mb-0.5">Tanggal &amp; Waktu</span>
<span class="text-body-lg font-body-lg text-on-surface">Hari ini, 12:45</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-outline transition-colors">chevron_right</span>
</button>
<!-- Merchant Field -->
<div class="flex items-center w-full px-4 py-1 gap-4 border-b border-outline-variant bg-surface-container-lowest focus-within:bg-surface-container-low transition-colors">
<div class="w-10 h-10 flex items-center justify-center text-outline shrink-0">
<span class="material-symbols-outlined">storefront</span>
</div>
<div class="flex-1 flex flex-col justify-center relative py-3">
<input class="w-full bg-transparent border-none p-0 text-body-lg font-body-lg text-on-surface focus:ring-0 focus:outline-none placeholder:text-outline-variant peer" placeholder="Merchant (Opsional)" type="text"/>
</div>
</div>
<!-- Catatan Field -->
<div class="flex items-start w-full px-4 py-3 gap-4 border-b border-outline-variant bg-surface-container-lowest focus-within:bg-surface-container-low transition-colors">
<div class="w-10 h-10 flex items-center justify-center text-outline shrink-0 mt-1">
<span class="material-symbols-outlined">edit_note</span>
</div>
<div class="flex-1 flex flex-col justify-center relative">
<textarea class="w-full bg-transparent border-none p-0 mt-2 text-body-lg font-body-lg text-on-surface focus:ring-0 focus:outline-none placeholder:text-outline-variant resize-none" placeholder="Catatan (Opsional)" rows="2"></textarea>
</div>
</div>
<!-- Lampiran Field -->
<button class="flex items-center w-full px-4 py-4 gap-4 hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 flex items-center justify-center text-primary shrink-0 group-hover:bg-primary-fixed/50 rounded-full transition-colors">
<span class="material-symbols-outlined">attach_file</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<span class="text-body-lg font-body-lg text-primary font-medium">Tambah Lampiran</span>
</div>
</button>
</div>
</div>
</main>
<!-- ACTION AREA (Sticky Bottom) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/90 backdrop-blur-sm border-t border-outline-variant z-50">
<div class="w-full max-w-lg mx-auto">
<button class="w-full bg-primary-container text-on-primary-container rounded-full py-4 flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-colors shadow-sm active:scale-[0.98]">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-headline-md font-headline-md">Simpan Transaksi</span>
</button>
</div>
</div>
</body></html>
